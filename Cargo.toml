[package]
name = "rust-i18n"
version = "0.1.0"
edition = "2021"
description = "A standalone, reusable Rust library for internationalization of applications"
license = "MIT"
repository = "https://github.com/wiederda/rust-i18n"
documentation = "https://docs.rs/rust-i18n"
authors = ["wiederda"]
keywords = ["i18n", "internationalization", "localization", "translation", "multilingual"]
categories = ["localization", "internationalization"]
readme = "README.md"

[dependencies]
serde_json = "1.0"
lazy_static = "1.4"

[lib]
name = "rust_i18n"